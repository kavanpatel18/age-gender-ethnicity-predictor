<!DOCTYPE html>
<html>
<head>
  <link href="../static/css/main.css" rel="stylesheet">
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.3/css/font-awesome.min.css" rel="stylesheet">
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.5/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.5/js/bootstrap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
  <script src="../static/js/main.js"></script>
  <title>Age Gender Ethnicity Predictor</title>
</head>
<body>
  <div class="container center">
    <div class="row"><div class="col-md-12">
      <h1 class="white">Age Gender Ethnicity Predictor</h1>
      <p class="white">Upload an image and click Predict.</p>
    </div></div>
    <form id="upload-file" method="post" action="#" enctype="multipart/form-data">
      <div class="row"><div class="col-md-6 col-md-offset-3 center">
        <div class="btn-container">
          <h1 class="imgupload"><i class="fa fa-file-image-o"></i></h1>
          <h1 class="imgupload ok"><i class="fa fa-check"></i></h1>
          <h1 class="imgupload stop"><i class="fa fa-times"></i></h1>
          <p id="namefile">Only images are allowed.</p>
          <button type="button" id="btnup" class="btn btn-primary btn-lg">Browse</button>
          <input type="file" name="fileup" id="fileup">
        </div>
      </div></div>
      <div class="row"><div class="col-md-12">
        <button type="button" class="btn btn-primary btn-lg" id="btn-predict">Predict</button>
      </div></div>
    </form>
  </div>
  <div class="loader" style="display:none;"></div>
  <h3 id="result"><span></span></h3>
  <div id="showImg"></div>
</body>
</html>
